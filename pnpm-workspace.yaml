packages:
  - 'packages/*'
  # muya v2 (TS) nests its dev surface and Playwright suite inside its own
  # package directory rather than as siblings under packages/, so list them
  # explicitly.
  - 'packages/muya/examples'
  - 'packages/muya/e2e'

allowBuilds:
  ced: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  native-keymap: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  postcss: 8.5.23
  esbuild@>=0.27.0 <0.28.1: 0.28.1
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  fast-uri@<3.1.5: 3.1.5
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  sharp@<0.35.0: 0.35.0
  svgo@<3.3.4: 3.3.4
  tar@<7.5.21: 7.5.21
  tmp@>=0.2.6 <0.2.7: 0.2.7
  undici@<6.28.0: 6.28.0
  undici@>=7.0.0 <7.29.0: 7.29.0
